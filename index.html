<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 창문 대시보드</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 30px 10px;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            max-width: 450px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { margin-bottom: 20px; color: #2c3e50; }
        
        /* 섹션 박스 공통 스타일 */
        .section-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #e9ecef;
        }
        .section-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }
        
        /* 상태 및 센서 텍스트 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.95rem;
        }
        .info-item {
            background: white;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }
        .status-open { color: #27ae60; font-weight: bold; }
        .status-closed { color: #c0392b; font-weight: bold; }

        /* 제어 버튼 및 슬라이더 */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .btn-open { background-color: #2ecc71; }
        .btn-close { background-color: #e74c3c; }
        .btn-mode { background-color: #3498db; margin-top: 5px; width: 100%; }

        /* 슬라이더 영역 */
        .slider-container {
            margin-top: 15px;
            text-align: center;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        /* 로그 영역 */
        .log-box {
            font-size: 0.85rem;
            color: #666;
            background: #fff;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🪟 스마트 창문 제어 시스템</h2>
        
        <!-- 0. 실시간 바깥 날씨 정보 (기기 위치 기반) -->
        <div class="section-box" style="background: #e8f4fd; border-color: #bbeeff;">
            <div class="section-title" style="color: #0056b3;">🌍 실시간 외부 날씨 (<span id="locationText">현재 위치</span>)</div>
            <div class="info-grid">
                <div class="info-item">외부 날씨: <span id="weatherState">불러오는 중...</span></div>
                <div class="info-item">외부 기온: <span id="weatherTemp">--</span>°C</div>
            </div>
        </div>

        <!-- 1. 현재 창문 및 모드 상태 -->
        <div class="section-box">
            <div class="section-title">📊 시스템 상태</div>
            <div style="font-size: 1.1rem; margin-bottom: 8px;">
                현재 상태: <span id="windowStatus" class="status-closed">확인 중...</span>
